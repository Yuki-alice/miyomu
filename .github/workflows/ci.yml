name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  desktop:
    name: Desktop product and JVM spikes
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK platforms
        run: sdkmanager --install "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared runtime and data tests
        run: ./gradlew :shared:source-runtime:jvmTest :shared:data:jvmTest
      - name: Desktop shell
        run: ./gradlew :desktopApp:compileKotlin
      - name: Phase 0 JVM spikes
        run: ./gradlew -p experiments :spikes:s3-ui:build :spikes:s1-player:build :spikes:s2-js-runtime:build

  android:
    name: Android app and experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK platforms
        run: sdkmanager --install "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: M0 toolchain probe
        run: ./gradlew -p experiments/phase1/toolchain-probe assembleDebug
      - name: M0 network probe
        run: ./gradlew -p experiments/phase1/network-probe jvmTest assemble
      - name: S1 Android player spike
        run: ./gradlew -p experiments/spikes/s1-player-android assembleDebug
      - name: S2 Android source runtime spike
        run: ./experiments/spikes/s2-js-runtime-android/gradlew -p experiments/spikes/s2-js-runtime-android assembleDebug
      - name: Miyomu shared source runtime and data
        run: ./gradlew :shared:source-runtime:jvmTest :shared:source-runtime:assemble :shared:data:jvmTest :shared:data:assemble
      - name: Miyomu Android shell
        run: ./gradlew :androidApp:assembleDebug

  ios:
    name: iOS source runtime tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: S2 iOS simulator tests
        run: ./experiments/spikes/s2-js-runtime-ios/gradlew -p experiments/spikes/s2-js-runtime-ios iosSimulatorArm64Test
