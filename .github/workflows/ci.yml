name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build Android
        run: ./gradlew :app:android:assembleDebug --stacktrace
      - name: Desktop tests
        run: ./gradlew :app:desktop:test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: miyomu-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk

  ios-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Link iOS simulator framework
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate
      - name: Build iOS simulator app
        run: |
          xcodebuild -project iosApp/Miyomu.xcodeproj -scheme Miyomu \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
